[project]
name = "duongdep"
version = "0.0.1"
description = "Chọn đường dễ đi cho ô tô ở Việt Nam — comfortable routing on OpenStreetMap"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hien Tran Doan" }]
keywords = ["routing", "openstreetmap", "vietnam", "navigation", "osm"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
duongdep = "duongdep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duongdep"]

[tool.ruff]
line-length = 110
target-version = "py310"
